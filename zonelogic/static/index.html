<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZoneLogic</title>
<style>
  :root { --bg:#0f141a; --panel:#18202a; --line:#2a3542; --text:#e6edf3; --muted:#8b98a5;
          --accent:#3fb6a8; --alert:#e5534b; --zone:rgba(63,182,168,.22); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:var(--muted); }
  main { display:grid; grid-template-columns: minmax(0,1fr) 360px; gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .panel + .panel { margin-top:12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  #stage { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:6px; overflow:hidden; }
  #stage video, #stage canvas { position:absolute; inset:0; width:100%; height:100%; }
  #stage video { object-fit:fill; }
  #stage.drawing canvas { cursor:crosshair; }
  #banner { position:absolute; left:8px; right:8px; top:8px; padding:8px 10px; border-radius:6px;
            background:var(--alert); color:#fff; font-weight:600; display:none; }
  #synthetic { position:absolute; left:8px; bottom:8px; padding:2px 8px; border-radius:4px;
               background:#b08800; color:#000; font-size:12px; font-weight:600; display:none; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  label { color:var(--muted); font-size:12px; display:block; margin-top:8px; }
  input, select, button { font:inherit; color:var(--text); background:#0f141a; border:1px solid var(--line);
                          border-radius:6px; padding:6px 8px; }
  input, select { width:100%; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#04201c; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  #scrub { flex:1; }
  ul { list-style:none; margin:0; padding:0; }
  li { border-top:1px solid var(--line); padding:8px 0; }
  li:first-child { border-top:0; }
  .ticket .meta { color:var(--muted); font-size:12px; }
  .ticket.resolved { opacity:.5; }
  .tag { display:inline-block; padding:0 6px; border-radius:4px; background:var(--alert); color:#fff; font-size:12px; }
  .ticket.resolved .tag { background:var(--line); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>ZoneLogic</h1>
  <span class="sub">Draw a zone, pick object classes, get a ticket when the rule is broken.</span>
</header>
<main>
  <section>
    <div class="panel">
      <div class="row" style="margin-top:0">
        <select id="clip" aria-label="Clip"></select>
      </div>
      <div class="row">
        <div id="stage">
          <video id="video" muted playsinline></video>
          <canvas id="overlay" aria-label="Video with zones and detections"></canvas>
          <div id="banner" role="alert"></div>
          <div id="synthetic">SYNTHETIC TEST DATA, not VAST footage</div>
        </div>
      </div>
      <div class="row">
        <button id="play">Play</button>
        <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Time">
        <span id="time" class="muted">0.0 s</span>
        <label style="margin:0"><input id="showBoxes" type="checkbox" checked style="width:auto"> boxes</label>
      </div>
    </div>
    <div class="panel">
      <h2>Zones</h2>
      <div class="row" style="margin-top:0">
        <input id="zoneName" placeholder="Zone name, e.g. crosswalk" style="flex:1;width:auto">
        <button id="draw">Draw zone</button>
        <button id="finish" disabled>Finish</button>
        <button id="cancel" disabled>Cancel</button>
      </div>
      <p class="muted" id="drawHint" style="margin:8px 0 0">Click "Draw zone", then click points on the video. Finish needs 3+ points.</p>
      <ul id="zones"></ul>
    </div>
  </section>
  <aside>
    <div class="panel">
      <h2>Rule</h2>
      <label for="ruleZone">Zone</label>
      <select id="ruleZone"></select>
      <label for="ruleClasses">Object classes (comma separated, YOLO/COCO names)</label>
      <input id="ruleClasses" value="car, truck, bus">
      <label for="ruleTrigger">Trigger</label>
      <select id="ruleTrigger">
        <option value="dwell">stays inside for at least N seconds</option>
        <option value="enter">crosses from outside to inside</option>
      </select>
      <label for="ruleDwell">N seconds (dwell only)</label>
      <input id="ruleDwell" type="number" min="0" step="0.5" value="3">
      <label for="ruleAnchor">Counts as inside when</label>
      <select id="ruleAnchor">
        <option value="bottom">bottom-center of box is inside (ground contact)</option>
        <option value="overlap">at least 30% of box overlaps zone</option>
        <option value="center">box center is inside</option>
      </select>
      <label for="ruleConf">Minimum detection confidence</label>
      <input id="ruleConf" type="number" min="0" max="1" step="0.05" value="0.4">
      <div class="row"><button id="addRule">Add rule</button></div>
      <ul id="rules"></ul>
      <div class="row">
        <button id="runClip" class="primary">Run on this clip</button>
        <button id="runCamera">Run on every clip from this camera</button>
      </div>
      <p id="runStatus" class="muted" style="margin:8px 0 0"></p>
    </div>
    <div class="panel">
      <h2>Incidents</h2>
      <ul id="incidents"><li class="muted">No incidents yet.</li></ul>
    </div>
  </aside>
</main>
<script src="app.js"></script>
</body>
</html>
